[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remy"
version = "0.1.0"
description = "Recursively Evolving Machine, Yours. Voice assistant on a Jetson that rewrites its own code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<2",            # tflite-runtime on Jetson crashes on numpy 2.x
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "textual>=0.58",
    "pyyaml>=6",
    "tomli>=2.0; python_version < '3.11'",
    # selftest is a product feature (self-iteration gate), so test deps ship
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# Piper is intentionally NOT a Python dependency. Its current engine
# (OHF-Voice/piper1-gpl, pip `piper-tts` >= 1.3) is GPL-3.0; importing it would
# make REMY (MIT) a GPL derivative. REMY runs the `piper` binary out-of-process
# instead — install it via the OS / a release build (see scripts/install.sh).
# The remy/licensing.py guard fails --selftest if a GPL piper-tts is installed.
[project.optional-dependencies]
dev = ["ruff>=0.4"]
# Agent SDK engine (ADR 0001). Optional until validated on-box; the CLI engine
# is the default. On the Jetson: `pip install -e .[sdk]`, then set
# [claude] engine = "sdk". The aarch64 wheel bundles the claude binary.
sdk = ["claude-agent-sdk>=0.2"]

[project.scripts]
remy = "remy.__main__:main"

[tool.setuptools.packages.find]
include = ["remy*"]

[tool.setuptools.package-data]
"remy.server" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
