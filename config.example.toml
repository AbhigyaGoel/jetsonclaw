# REMY configuration — copy to ~/.remy/config.toml and edit.
# Everything here is optional; unspecified values use sensible Jetson defaults.

[identity]
name = "Remy"                  # what your assistant calls itself
owner = "Chud"                 # what it calls you
# NOTE: the *wake word* is separate — it's an acoustic model, see [wake].

[audio]
mic_device = "plughw:2,0"     # find yours: arecord -l
speaker_device = "default"     # find yours: aplay -l (e.g. "plughw:0,3" for HDMI)
silence_rms = 500.0
silence_secs = 1.5

[wake]
model = "hey_jarvis_v0.1"      # or a path to a custom model, see docs/wake-word.md
framework = "tflite"           # "onnx" for custom ONNX models
threshold = 0.3                # lower = more sensitive

[stt]
model = "base"                 # tiny is faster but mishears uncommon words

[tts]
enabled = true
voice = "en_GB-alan-medium"    # the butler. browse: rhasspy.github.io/piper-samples
length_scale = 1.0             # >1 = slower speech
binary = "piper"               # REMY runs the piper binary out-of-process (GPL stays out)

[chat]
provider = "ollama"            # or "openai" for any /v1/chat/completions endpoint
model = "qwen2.5:3b"
num_predict = 150
# openai provider example (Groq, OpenRouter, vLLM, llama.cpp, LM Studio, ...):
# provider = "openai"
# url = "https://api.groq.com/openai/v1/chat/completions"
# model = "llama-3.3-70b-versatile"
# api_key_env = "GROQ_API_KEY"   # name of the env var holding the key

[claude]
workdir = "~/remy"       # where agent tasks run by default
timeout_secs = 600
permission_mode = "acceptEdits"
allowed_tools = "Read,Edit,Write,Glob,Grep"  # add ",Bash" only if you accept the risk
confirm_tasks = true           # require a spoken "yes" before agent tasks run
# mcp_config = "~/.remy/mcp.json"  # agent sessions inherit these MCP servers
# heartbeat_hours = 6            # run ~/.remy/HEARTBEAT.md as an agent task on this cadence
# The agent is denied Read on REMY's secret stores via a managed --settings file.
# deny_read = ["~/.remy/secrets/**", "~/spotify_tokens.json", "~/.claude/.credentials.json"]

[spotify]
token_file = "~/spotify_tokens.json"
# Link Spotify with a 127.0.0.1 loopback (localhost is rejected since 2025):
#   python3 scripts/spotify_auth.py --client-id XXX --client-secret YYY
# Register redirect URI http://127.0.0.1:8888/callback in your Spotify app first.

[server]
host = "0.0.0.0"
port = 8484
auth_token = ""                # set to require ?key=<token> on the dashboard
